services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      network: host   # kilimanjaro: build containers have no bridge egress - build via host stack
    container_name: scl-agent-manager-dashboard
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-9005}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent_state:/app/state
      # Mount outputs directory for Trident compatibility + Replay persistence.
      # Read-write: the agent-manager's auto_responder writes soc_god logs + alerts here.
      - ${OUTPUTS_DIR:-/tmp/outputs}:/outputs:rw
    environment:
      - TOPOLOGY_PLUGIN_URL=http://scl-network-topology:9002
      - SCL_NETWORK_NAME=playground-net
      - AGENT_MANAGER_CONTAINER_NAME=scl-agent-manager-dashboard
      - OPENCODE_PORT=4096
      - OPENCODE_IMAGE_CODER56=${OPENCODE_IMAGE_CODER56:-ghcr.io/stratocyber/opencode-coder56:latest}
      - OPENCODE_IMAGE_DB_ADMIN=${OPENCODE_IMAGE_DB_ADMIN:-ghcr.io/stratocyber/opencode-db-admin:latest}
      - AGENT_STATE_DIR=/app/state
      - DASHBOARD_PORT=8080
      - OUTPUTS_DIR=/outputs
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # LLM config for the defender planner (and reused by soc_god via the topology)
      - LLM_URL=${LLM_URL:-https://llm.ai.e-infra.cz/v1}
      - LLM_MODEL=${LLM_MODEL:-gemma4}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - DEFENDER_LLM_API_KEY=${OPENCODE_API_KEY}
      - PLANNER_MODEL=${PLANNER_MODEL:-gpt-oss-120b}
    networks:
      - playground-net
    restart: unless-stopped

  # NVIDIA NEMOTRON proxy for opencode: de-streams nemotron responses and injects
  # the chat_template_kwargs / reasoning_budget NVIDIA requires (opencode 1.18.3's
  # openai-compatible provider can't send these itself). Forwards the client's
  # Authorization header to NVIDIA's upstream, so NO secret is baked into the
  # image/compose. Reached by containers on playground-net as
  # http://scl-nvidia-proxy:8448/v1 (see backend/routers/settings.py PROVIDER_PRESETS).
  nvidia-proxy:
    build:
      context: ./nvidia-proxy
      network: host   # kilimanjaro: Docker build bridge cannot reach registries
    image: scl-nvidia-proxy:0.1
    container_name: scl-nvidia-proxy
    hostname: scl-nvidia-proxy
    restart: unless-stopped
    networks:
      - playground-net

volumes:
  agent_state:

networks:
  playground-net:
    external: true
    name: playground-net
